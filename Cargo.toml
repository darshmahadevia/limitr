[package]
name = "limitr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first view of current Codex rate limits"
license = "MIT"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.41", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[dev-dependencies]
assert_cmd = "2.0.17"
tempfile = "3.20.0"
