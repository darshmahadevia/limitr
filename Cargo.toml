[package]
name = "limitr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first view of current Codex rate limits"
license = "MIT"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.41", features = ["derive"] }
crossterm = "0.28.1"
ratatui = "0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "0.9.2"

[dev-dependencies]
assert_cmd = "2.0.17"
portable-pty = "0.9.0"
tempfile = "3.20.0"
vt100 = "0.15.2"
